[project]
name = "rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sudip Kumar", email = "sudipkumar.js@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "celery>=5.7.0",
    "fastapi>=0.164.0",
    "langfuse>=2.0.0,<3.0.0",
    "minio>=7.2.20",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "qdrant-client>=1.20.0",
    "ragas>=0.4.4",
    "redis>=8.1.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
    "tiktoken>=0.7.0",
    "python-multipart>=0.0.34",
    "groq>=1.7.0",
    "openai>=3.3.0",
]

[project.scripts]
rag-app = "app.main:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
